[project]
name = "wadi-scraper"
version = "0.1.0"
description = "Competitor sitemap tracker for Nike"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27",
  "brotli>=1.1",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wadi-scraper = "wadi_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadi_scraper"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"src/wadi_scraper/ui/report_viewer.html" = "wadi_scraper/ui/report_viewer.html"
"docs/how-this-project-works.md" = "wadi_scraper/ui/how-this-project-works.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
