<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Competitor reports</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1114;
      --panel: #1a1d23;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #7cacf8;
      --ok: #5bb974;
      --warn: #f0b429;
      --err: #f07178;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
    .client { color: var(--muted); font-size: 0.9rem; }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      min-height: calc(100vh - 56px);
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    aside {
      border-right: 1px solid var(--border);
      padding: 1rem;
      overflow: auto;
    }
    label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 0.35rem; }
    select {
      width: 100%;
      padding: 0.5rem;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 1rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; color: var(--muted); font-weight: 500; padding: 0.4rem 0.25rem; }
    td { padding: 0.45rem 0.25rem; border-top: 1px solid var(--border); cursor: pointer; }
    tr:hover td { background: var(--panel); }
    tr.selected td { background: #252932; }
    .badge {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: lowercase;
    }
    .badge.ok { background: #1e3a2f; color: var(--ok); }
    .badge.partial { background: #3a3420; color: var(--warn); }
    .badge.sitemap_error, .badge.failed { background: #3a2024; color: var(--err); }
    main { padding: 1.25rem 1.5rem; overflow: auto; }
    .toolbar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .toolbar button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .toolbar button:hover { border-color: var(--accent); }
    .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
    #report-md {
      max-width: 52rem;
      line-height: 1.55;
    }
    #report-md h1, #report-md h2, #report-md h3 { margin-top: 1.25em; }
    #report-md a { color: var(--accent); }
    #report-md code { background: var(--panel); padding: 0.1em 0.35em; border-radius: 4px; }
    #report-md pre { background: var(--panel); padding: 1rem; overflow: auto; border-radius: 8px; }
    #report-raw {
      display: none;
      white-space: pre-wrap;
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      max-width: 52rem;
      background: var(--panel);
      padding: 1rem;
      border-radius: 8px;
    }
    footer {
      padding: 0.75rem 1.25rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
    }
    .empty { color: var(--muted); padding: 2rem 0; }
    .run-actions { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .run-actions button.primary {
      background: #2a4070;
      border-color: var(--accent);
    }
    .run-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
    #job-panel {
      display: none;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.8rem;
    }
    #job-panel.active { display: block; }
    #job-log {
      margin: 0.5rem 0 0;
      padding: 0;
      list-style: none;
      max-height: 8rem;
      overflow: auto;
      color: var(--muted);
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
    }
    #job-log li { margin: 0.15rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Competitor reports</h1>
    <span class="client" id="client-label"></span>
  </header>
  <div class="layout">
    <aside>
      <label for="competitor-filter">Competitor</label>
      <select id="competitor-filter">
        <option value="">All runs</option>
      </select>
      <div class="run-actions">
        <button type="button" class="primary" id="btn-run">Run selected brand</button>
        <button type="button" id="btn-run-all">Run all enabled</button>
      </div>
      <div id="job-panel">
        <strong id="job-title">Crawl in progress…</strong>
        <ul id="job-log"></ul>
      </div>
      <table>
        <thead>
          <tr><th>Run</th><th>Status</th><th>When</th></tr>
        </thead>
        <tbody id="runs-body"></tbody>
      </table>
    </aside>
    <main>
      <div class="toolbar">
        <span class="badge" id="status-badge" hidden></span>
        <button type="button" id="toggle-raw">Show raw markdown</button>
      </div>
      <div class="meta" id="report-meta"></div>
      <div id="report-md" class="empty">Select a run to view its report.</div>
      <pre id="report-raw"></pre>
    </main>
  </div>
  <footer>
    Crawls use the same pipeline as <code>python -m wadi_scraper run</code>. One crawl at a time.
  </footer>
  <script>
    let selectedRunId = null;
    let rawMarkdown = "";
    let showRaw = false;
    let pollTimer = null;
    let competitorsData = [];

    function fmtTime(iso) {
      if (!iso) return "—";
      return iso.replace(" UTC", "").slice(0, 16);
    }

    async function loadCompetitors() {
      const res = await fetch("/api/competitors");
      const data = await res.json();
      document.getElementById("client-label").textContent = data.client || "";
      competitorsData = data.competitors || [];
      const sel = document.getElementById("competitor-filter");
      for (const c of competitorsData) {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.name + (c.enabled ? "" : " (disabled)");
        sel.appendChild(opt);
      }
    }

    async function loadRuns() {
      const competitor = document.getElementById("competitor-filter").value;
      const q = competitor ? "?competitor=" + encodeURIComponent(competitor) : "";
      const res = await fetch("/api/runs" + q);
      const data = await res.json();
      const tbody = document.getElementById("runs-body");
      tbody.innerHTML = "";
      for (const r of data.runs || []) {
        const tr = document.createElement("tr");
        if (r.id === selectedRunId) tr.classList.add("selected");
        tr.dataset.runId = r.id;
        const when = fmtTime(r.finished_at || r.started_at);
        tr.innerHTML =
          "<td>" + r.competitor_id + " #" + (r.snapshot_number || r.id) +
          ' <span style="color:var(--muted);font-size:0.7rem">id ' + r.id + "</span></td>" +
          '<td><span class="badge ' + r.status + '">' + r.status + "</span></td>" +
          "<td>" + when + "</td>";
        tr.addEventListener("click", () => selectRun(r.id));
        tbody.appendChild(tr);
      }
    }

    async function selectRun(runId) {
      selectedRunId = runId;
      await loadRuns();
      const res = await fetch("/api/runs/" + runId + "/report");
      if (!res.ok) {
        document.getElementById("report-md").textContent = "Report not found.";
        return;
      }
      const data = await res.json();
      rawMarkdown = data.markdown || "";
      const badge = document.getElementById("status-badge");
      badge.hidden = false;
      badge.className = "badge " + (data.status || "");
      badge.textContent = data.status || "";
      document.getElementById("report-meta").textContent =
        (data.competitor_name || data.competitor_id) +
        " · snapshot #" + (data.snapshot_number || "?") +
        (data.run_id ? " (db id " + data.run_id + ")" : "") +
        (data.generated_at_utc ? " · Generated " + data.generated_at_utc : "") +
        (data.has_report ? "" : " · (no stored markdown yet)");
      renderReport();
    }

    function renderReport() {
      const mdEl = document.getElementById("report-md");
      const rawEl = document.getElementById("report-raw");
      if (showRaw) {
        mdEl.style.display = "none";
        rawEl.style.display = "block";
        rawEl.textContent = rawMarkdown || "(empty)";
      } else {
        mdEl.style.display = "block";
        rawEl.style.display = "none";
        if (!rawMarkdown) {
          mdEl.className = "empty";
          mdEl.textContent = "No markdown stored for this run.";
        } else {
          mdEl.className = "";
          mdEl.innerHTML = marked.parse(rawMarkdown);
        }
      }
    }

    document.getElementById("competitor-filter").addEventListener("change", () => {
      selectedRunId = null;
      document.getElementById("report-md").className = "empty";
      document.getElementById("report-md").textContent = "Select a run to view its report.";
      loadRuns();
    });

    document.getElementById("toggle-raw").addEventListener("click", () => {
      showRaw = !showRaw;
      document.getElementById("toggle-raw").textContent =
        showRaw ? "Show rendered" : "Show raw markdown";
      renderReport();
    });

    function setRunButtonsDisabled(disabled) {
      document.getElementById("btn-run").disabled = disabled;
      document.getElementById("btn-run-all").disabled = disabled;
    }

    async function startCrawl(body) {
      setRunButtonsDisabled(true);
      const panel = document.getElementById("job-panel");
      const logEl = document.getElementById("job-log");
      panel.classList.add("active");
      logEl.innerHTML = "";
      document.getElementById("job-title").textContent = "Starting crawl…";
      const res = await fetch("/api/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        document.getElementById("job-title").textContent = data.error || "Failed to start";
        setRunButtonsDisabled(false);
        return;
      }
      pollJob(data.job_id);
    }

    function pollJob(jobId) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        const res = await fetch("/api/jobs/" + jobId);
        const job = await res.json();
        const logEl = document.getElementById("job-log");
        logEl.innerHTML = (job.lines || []).map((l) => "<li>" + l + "</li>").join("");
        logEl.scrollTop = logEl.scrollHeight;
        document.getElementById("job-title").textContent =
          "Crawl: " + job.status + (job.error ? " — " + job.error : "");
        if (job.status === "done" || job.status === "failed") {
          clearInterval(pollTimer);
          pollTimer = null;
          setRunButtonsDisabled(false);
          await loadRuns();
          const lastId = (job.run_ids || []).slice(-1)[0];
          if (lastId) await selectRun(lastId);
        }
      }, 2000);
      fetch("/api/jobs/" + jobId).then((r) => r.json()).then((job) => {
        const logEl = document.getElementById("job-log");
        logEl.innerHTML = (job.lines || []).map((l) => "<li>" + l + "</li>").join("");
      });
    }

    document.getElementById("btn-run").addEventListener("click", () => {
      const cid = document.getElementById("competitor-filter").value;
      if (!cid) {
        alert("Select a competitor first.");
        return;
      }
      const c = competitorsData.find((x) => x.id === cid);
      if (c && !c.enabled) {
        alert("That brand is disabled in config.");
        return;
      }
      startCrawl({ competitor_id: cid });
    });

    document.getElementById("btn-run-all").addEventListener("click", () => {
      if (!confirm("Run all enabled competitors? This may take several minutes.")) return;
      startCrawl({ all_enabled: true });
    });

    (async () => {
      await loadCompetitors();
      await loadRuns();
    })();
  </script>
</body>
</html>
